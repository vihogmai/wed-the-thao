<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng bài viết mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-danger fw-bold text-center mb-4">ĐĂNG BÀI VIẾT MỚI</h2>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Tiêu đề bài viết:</label>
                    <input type="text" name="tieu_de" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Tóm tắt ngắn:</label>
                    <textarea name="tom_tat" class="form-control" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nội dung chi tiết:</label>
                    <textarea name="noi_dung" class="form-control" rows="5" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Chọn ảnh minh họa từ máy tính:</label>
                    <input type="file" name="anh_minh_hoa" class="form-control" accept="image/*" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Số lượt xem ảo (Ví dụ: 150):</label>
                    <input type="number" name="luot_xem" class="form-control" value="0">
                </div>
                <div style="margin-bottom: 15px;">
    <label for="the_loai">Chọn chủ đề:</label>
    <select name="the_loai" id="the_loai" style="width: 100%; padding: 8px;" required>
        <option value="bong_da">Bóng Đá</option>
        <option value="bong_ro">Bóng Rổ</option>
        <option value="tennis">Tennis</option>
        <option value="cau_long">Cầu Lông</option>
        <option value="dua_xe">Đua Xe F1</option>
        <option value="vo_thuat">Võ Thuật</option>
        <option value="esports">Esports</option>
        <option value="nhan_dinh">Nhận Định</option>
        </select>
</div>
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2">XÁC NHẬN ĐĂNG BÀI</button>
            </form>
            
            <a href="/" class="btn btn-outline-secondary w-100 mt-2">Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
