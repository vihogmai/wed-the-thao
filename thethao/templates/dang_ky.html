<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 450px;">
        <div class="card shadow p-4">
            <h3 class="text-center fw-bold text-success mb-4">ĐĂNG KÝ THÀNH VIÊN</h3>
            {% if error %}
                <div class="alert alert-danger p-2 small text-center">{{ error }}</div>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên tài khoản muốn tạo:</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu:</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nhập lại mật khẩu:</label>
                    <input type="password" name="re_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2">TẠO TÀI KHOẢN</button>
            </form>
            <p class="text-center small mt-3 mb-0">Đã có tài khoản? <a href="/dang-nhap/">Đăng nhập ngay</a></p>
        </div>
    </div>
</body>
</html>
